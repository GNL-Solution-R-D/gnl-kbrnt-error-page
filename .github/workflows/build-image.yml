# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🐋 Build & push image

on:
  push:
    branches: [main]
    tags: ['v*'] # no `paths-ignore` here on purpose: it would silently skip tag pushes
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push the server image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to ghcr.io
    steps:
      - uses: actions/checkout@v7

      # compute the (lowercased) image name and the tag list:
      #   - push on main         -> :latest, :main-<short-sha>
      #   - git tag vX.Y.Z       -> :X.Y.Z, :X.Y, :X, :latest
      - id: meta
        run: |
          set -eu
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}" # ghcr.io accepts lowercase names only

          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            VERSION="${GITHUB_REF_NAME#v}"        # v1.2.3 -> 1.2.3
            MINOR="${VERSION%.*}"                 # 1.2.3  -> 1.2
            MAJOR="${VERSION%%.*}"                # 1.2.3  -> 1
            TAGS="${IMAGE}:${VERSION},${IMAGE}:${MINOR},${IMAGE}:${MAJOR},${IMAGE}:latest"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
            TAGS="${IMAGE}:latest,${IMAGE}:${VERSION}"
          fi

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Image tags: ${TAGS}" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
